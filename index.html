<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>買了啦・賣場特價清單</title>
<meta name="description" content="各大賣場本檔特價的完整清單，非官方整理，價格以賣場現場標示為準。">
<meta name="theme-color" content="#2E144A">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--ground:#F4F1F7;--surface:#FFFFFF;--ink:#24172F;--muted:#6C6180;--line:#E3DCEA;--brand:#2E144A;--gold:#E2B44E;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#15101C;--surface:#1F1829;--ink:#F1EAF7;--muted:#A59AB5;--line:#352B42;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#15101C;--surface:#1F1829;--ink:#F1EAF7;--muted:#A59AB5;--line:#352B42;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--font);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.top{background:var(--brand);color:#FFF6E4;padding-block:28px}
.top img{width:72px;height:72px;border-radius:50%}
h1{margin:10px 0 4px;font-size:30px;font-weight:900}
.top p{margin:0;opacity:.85}
h2{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:24px 0 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.store{font-weight:900;font-size:18px}
.when{font-size:13px;color:var(--muted)}
.n{font-weight:700;white-space:nowrap}
.live{display:inline-block;font-size:12px;font-weight:700;background:var(--gold);color:#3A2700;border-radius:6px;padding:0 7px;margin-left:6px;vertical-align:2px}
footer{padding-block:28px 40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="logo.png" alt="買了啦">
  <h1>買了啦</h1>
  <p>各大賣場本檔特價，完整清單一次看</p>
</div></header>
<main class="wrap">
  <h2 id="h-now">特價中</h2><ul id="now"></ul>
  <h2 id="h-old" hidden>已結束</h2><ul id="old"></ul>
</main>
<footer class="wrap">非官方整理，與各賣場無合作；價格以賣場現場標示為準。</footer>
<script>
const L = [{"slug": "px-20261002", "store": "全聯", "period": "10/2～10/15", "start": "2026-10-02", "end": "2026-10-15", "n": 858}, {"slug": "wjf-20260930", "store": "萬家福", "period": "9/30～10/13", "start": "2026-09-30", "end": "2026-10-13", "n": 372}, {"slug": "costco-20260928", "store": "好市多", "period": "9/28～10/25", "start": "2026-09-28", "end": "2026-10-25", "n": 59}];
const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);   // 台灣日期
const card = x => `<li><a class="card" href="${x.slug}/"><span><span class="store">${x.store}</span>${x.end >= today ? '<span class="live">特價中</span>' : ''}<br><span class="when">${x.period}</span></span><span class="n">${x.n} 樣 ›</span></a></li>`;
const now = L.filter(x => x.end >= today), old = L.filter(x => x.end < today);
document.getElementById('now').innerHTML = now.map(card).join('') || '<li class="when">目前沒有進行中的檔期。</li>';
document.getElementById('old').innerHTML = old.map(card).join('');
document.getElementById('h-old').hidden = !old.length;
</script>
</body>
</html>
